<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATA SECURITY — ESCALA OPERACIONAL</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:        #080d14;
            --surface:   #0d1623;
            --panel:     #111c2d;
            --border:    #1e2f45;
            --border2:   #253b56;
            --blue:      #1565c0;
            --blue-glow: #1e88e5;
            --lime:      #c6d400;
            --lime-dim:  #8a9300;
            --cyan:      #29b6f6;
            --amber:     #ffa726;
            --muted:     #4a6080;
            --text:      #cdd9e5;
            --text-dim:  #7a9ab8;
            --white:     #f0f6ff;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: clip;
        }

        /* ─── GRID BACKGROUND ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(21, 101, 192, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(21, 101, 192, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ─── CORNER ACCENT ─── */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 400px; height: 400px;
            background: radial-gradient(circle at top left, rgba(21,101,192,0.12), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .app-shell {
            position: relative;
            z-index: 1;
            padding: 24px;
            max-width: 100%;
        }

        /* ─── HEADER ─── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 3px solid var(--blue-glow);
            border-radius: 12px;
            padding: 20px 28px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 300px; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(21,101,192,0.07));
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-box {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 60px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(198,212,0,0.25));
        }

        .divider-v {
            width: 1px;
            height: 50px;
            background: var(--border2);
        }

        /* ─── MONTH NAVIGATOR ─── */
        .month-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .month-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .month-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border2);
            border-radius: 8px;
            padding: 6px 12px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--lime);
            font-size: 16px;
            cursor: pointer;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background .15s;
        }
        .nav-btn:hover { background: rgba(198,212,0,0.12); }

        #current-month {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--white);
            min-width: 200px;
            text-align: center;
        }

        /* ─── LEGEND + EXPORT ─── */
        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .legend {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .leg {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-dim);
        }

        .leg-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
        }

        .btn-pdf {
            background: linear-gradient(135deg, var(--blue) 0%, var(--blue-glow) 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all .2s;
            box-shadow: 0 4px 20px rgba(21,101,192,0.4);
        }

        .btn-pdf:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 28px rgba(21,101,192,0.6);
        }

        /* ─── RESPONSIVE / MOBILE ─── */
        @media (max-width: 768px) {

            .app-shell { padding: 12px 10px; }

            /* HEADER — empilha verticalmente */
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
                padding: 14px 16px;
            }

            .brand {
                justify-content: center;
                gap: 14px;
            }

            .logo-img { height: 44px; }

            .divider-v { display: none; }

            #current-month {
                font-size: 16px;
                min-width: 140px;
            }

            /* HEADER-RIGHT — linha única */
            .header-right {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }

            .legend {
                gap: 8px;
                flex-wrap: wrap;
            }

            .leg { font-size: 10px; }

            .btn-pdf {
                padding: 9px 16px;
                font-size: 13px;
                letter-spacing: 1px;
            }

            /* STATS */
            .stats-row {
                gap: 8px;
            }

            .stat-card {
                padding: 10px 12px;
                min-width: unset;
                flex: 1 1 calc(50% - 8px);
            }

            /* TABLE — scroll horizontal já funciona;
               reduzir padding da coluna nome */
            .name-cell {
                width: 140px;
                min-width: 140px;
                font-size: 11px;
                padding: 0 8px;
                letter-spacing: 0;
            }

            .turno-cell {
                min-width: 24px;
                width: 24px;
                font-size: 10px;
            }

            .total-cell {
                width: 26px;
                min-width: 26px;
                max-width: 26px;
                font-size: 10px;
            }

            td.day-cell, th.day-cell {
                min-width: 22px;
                width: 22px;
                font-size: 9px;
            }

            td.day-cell.has-horario, th.day-cell.has-horario {
                min-width: 36px;
                width: 36px;
            }
        }

        @media (max-width: 480px) {
            .app-shell { padding: 8px 6px; }

            .header { padding: 12px 12px; }

            .legend { display: none; }  /* oculta legenda em telas muito pequenas */

            .header-right { justify-content: center; }

            .stat-card {
                flex: 1 1 calc(50% - 6px);
                padding: 8px 10px;
            }

            .stat-label { font-size: 10px; }
            .stat-value { font-size: 22px; }

            .name-cell {
                width: 110px;
                min-width: 110px;
                font-size: 10px;
                padding: 0 6px;
            }
        }


        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 120px;
            flex: 1 1 120px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .stat-value {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--white);
            line-height: 1;
        }

        .stat-value.blue { color: var(--blue-glow); }
        .stat-value.lime { color: var(--lime); }
        .stat-value.amber { color: var(--amber); }

        /* ─── TABLE ─── */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        /* Header row */
        thead tr {
            background: var(--panel);
        }

        th {
            border: 1px solid var(--border);
            padding: 10px 2px;
            text-align: center;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        th.day-th {
            min-width: 28px;
            width: 28px;
        }

        th.day-th.horario-wide {
            min-width: 46px;
            width: 46px;
        }

        th.day-head-weekend {
            color: var(--amber);
        }

        /* Body rows */
        tbody tr {
            transition: background .1s;
        }

        tbody tr:nth-child(even) { background: rgba(255,255,255,0.015); }
        tbody tr:hover { background: rgba(21,101,192,0.07); }

        td {
            border: 1px solid var(--border);
            padding: 0;
            text-align: center;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            height: 40px;
        }

        /* Células de dia: largura se ajusta ao conteúdo */
        td.day-cell {
            min-width: 28px;   /* cabe F, FE */
            width: 28px;
            white-space: nowrap;
        }

        td.day-cell.has-horario {
            min-width: 46px;   /* cabe 00:00 */
            width: 46px;
        }

        .name-cell {
            text-align: left;
            padding: 0 16px;
            width: 270px;
            min-width: 270px;
            position: sticky;
            left: 0;
            background: var(--surface);
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--white);
            z-index: 10;
            border-right: 2px solid var(--border2);
            white-space: nowrap;
        }

        tbody tr:nth-child(even) .name-cell { background: #0e1827; }
        tbody tr:hover .name-cell { background: #0f1e30; }

        .turno-cell {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: var(--lime);
            min-width: 30px;
            width: 30px;
        }

        .tot-cell {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 15px;
            font-weight: 800;
            background: var(--panel);
            color: var(--lime);
            width: 32px;
            min-width: 32px;
            max-width: 32px;
            border-left: 2px solid var(--border2);
        }

        .edit { outline: none; cursor: text; }

        /* Day cell states */
        .cell-work { color: var(--cyan); }
        .cell-off   { color: var(--muted); }
        .cell-fe    { color: var(--amber); }

        .day-col-weekend { background: rgba(255, 167, 38, 0.04); }

        /* Célula de horário — linha única, compacta e clara */
        td.is-horario {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--cyan);
        }

        /* ─── SCROLLBAR ─── */
        .table-wrapper::-webkit-scrollbar { height: 6px; }
        .table-wrapper::-webkit-scrollbar-track { background: var(--bg); }
        .table-wrapper::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

        /* ─── TOAST ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--blue);
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(10px);
            transition: all .3s;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>

    <!-- STATS -->
    <div class="stats-row" id="stats-row">

            <span class="stat-value" id="stat-dias">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Em Férias</span>
            <span class="stat-value amber" id="stat-ferias">0</span>
        </div>

            <span class="stat-label">Total Dias Trab.</span>
            <span class="stat-value lime" id="stat-total">0</span>

<div class="toast" id="toast"></div>

<script>
    const meses = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];
    let mesIdx = 2, ano = 2026;

    let funcionarios = JSON.parse(localStorage.getItem('sata_v12')) || [
        { n: "ANA DARIA F. SARMENTO",  t: "D", d: {} },
        { n: "BRENDA M. OLIVEIRA",      t: "C", d: {} },
        { n: "CELOIR A. MORAES",        t: "E", d: {} },
        { n: "CLENILTON F. CARVALHO",   t: "A", d: {} },
        { n: "CAIO V. SENA",            t: "F", d: {} },
        { n: "ELIZARA FLORES",          t: "E", d: {} },
        { n: "JAILSON M. MORAES",       t: "A", d: {} },
        { n: "MAYARA C. JESUS",         t: "F", d: {} },
        { n: "ROGERIO P. PINHEIRO",     t: "D", d: {} },
        { n: "FERNANDO S. LAPA",        t: "B", d: {} },
        { n: "FABRICIO J. AGUIAR",      t: "G", d: {} }
    ];

    function getDaysInMonth(m, a) { return new Date(a, m + 1, 0).getDate(); }
    function getDayOfWeek(a, m, d) { return new Date(a, m, d).getDay(); } // 0=Sun,6=Sat

    function isWeekend(a, m, d) {
        const dow = getDayOfWeek(a, m, d);
        return dow === 0 || dow === 6;
    }

    function changeMonth(dir) {
        mesIdx += dir;
        if (mesIdx > 11) { mesIdx = 0; ano++; }
        if (mesIdx < 0)  { mesIdx = 11; ano--; }
        document.getElementById('current-month').innerText = `${meses[mesIdx]} ${ano}`;
        render();
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
    }

    function isHorario(val) {
        return /^\d{2}:\d{2}$/.test(val);
    }

    function render() {
        const dias = getDaysInMonth(mesIdx, ano);
        const chave = `${meses[mesIdx]}_${ano}`;
        const DOW = ['D','S','T','Q','Q','S','S'];

        // Detecta quais colunas têm horário em algum funcionário
        const colWide = Array(31).fill(false);
        funcionarios.forEach(f => {
            if (!f.d[chave]) return;
            for (let i = 0; i < dias; i++) {
                const val = f.d[chave][i] || "F";
                if (isHorario(val)) colWide[i] = true;
            }
        });

        // Thead
        let h = `<th class="name-cell" style="left:0;z-index:20;background:var(--panel)">FUNCIONÁRIO</th>`;
        h += `<th style="min-width:30px">T</th>`;
        for (let i = 1; i <= dias; i++) {
            const dow = getDayOfWeek(ano, mesIdx, i);
            const wk = (dow === 0 || dow === 6);
            const wide = colWide[i-1];
            h += `<th class="day-th ${wk ? 'day-head-weekend' : ''} ${wide ? 'horario-wide' : ''}">${i}<br><span style="font-size:9px;opacity:.7">${DOW[dow]}</span></th>`;
        }
        h += `<th style="width:32px;min-width:32px;border-left:2px solid var(--border2)">Dias</th>`;
        document.getElementById('t-head').innerHTML = h;

        // Tbody
        let b = "";
        let statTotalDias = 0;
        let statFerias = 0;

        funcionarios.forEach((f, fIdx) => {
            if (!f.d[chave]) f.d[chave] = Array(31).fill("F");
            let tot = 0;
            let temFerias = false;
            let diasHTML = "";

            for (let i = 0; i < dias; i++) {
                let val = f.d[chave][i] || "F";
                const wk = isWeekend(ano, mesIdx, i + 1);
                const wide = colWide[i];
                const ehHorario = isHorario(val);

                let cls = "cell-off";
                if (val === "FE") {
                    cls = "cell-fe"; temFerias = true;
                } else if (val !== "F") {
                    // Conta horários E outras entradas que não sejam "F" ou "FE"
                    cls = "cell-work"; tot++; statTotalDias++;
                }

                // Horário: exibe o valor direto sem spans
                const displayHTML = val;

                diasHTML += `<td contenteditable="true" class="edit day-cell ${wide ? 'has-horario' : ''} ${cls} ${wk ? 'day-col-weekend' : ''} ${ehHorario ? 'is-horario' : ''}"
                    data-f="${fIdx}" data-d="${i}"
                    oninput="mascaraHorario(this)"
                    onkeydown="validarTecla(event,this)"
                    onblur="updateDia(${fIdx},${i},this)">${displayHTML}</td>`;
            }

            if (temFerias) statFerias++;

            b += `<tr>
                <td class="name-cell edit" contenteditable="true" onblur="updateNome(${fIdx},this)">${f.n}</td>
                <td class="turno-cell edit" contenteditable="true" onblur="updateTurno(${fIdx},this)">${f.t}</td>
                ${diasHTML}
                <td class="tot-cell">${tot}</td>
            </tr>`;
        });

        document.getElementById('t-body').innerHTML = b;

        // Stats
        document.getElementById('stat-func').innerText = funcionarios.length;
        document.getElementById('stat-dias').innerText = dias;
        document.getElementById('stat-ferias').innerText = statFerias;
        document.getElementById('stat-total').innerText = statTotalDias;

        localStorage.setItem('sata_v12', JSON.stringify(funcionarios));
    }

    /* ─── DETECTA MOBILE ─── */
    const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints > 1);

    /* ─── NAVEGA PARA PRÓXIMA CÉLULA DE DIA ─── */
    function moverProxima(el) {
        // Salva o valor atual antes de mover
        const fIdx = parseInt(el.dataset.f);
        const dIdx = parseInt(el.dataset.d);
        const chave = `${meses[mesIdx]}_${ano}`;
        let val = el.innerText.replace(/\s+/g,'').trim().toUpperCase();
        if (/^\d{4}$/.test(val)) val = val.substring(0,2) + ':' + val.substring(2,4);
        funcionarios[fIdx].d[chave][dIdx] = val || "F";

        // Encontra todas as células de dia editáveis na ordem do DOM
        const celulas = Array.from(document.querySelectorAll('td.day-cell.edit'));
        const idx = celulas.indexOf(el);
        const proxima = celulas[idx + 1];
        if (proxima) {
            proxima.focus();
            // Seleciona todo o conteúdo da célula destino
            try {
                const range = document.createRange();
                range.selectNodeContents(proxima);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            } catch(e) {}
        }
    }

    /* ─── VALIDAÇÃO DE TECLA ─── */
    function validarTecla(e, el) {
        const tecla = e.key;

        // Tab → próxima célula (desktop e mobile)
        if (tecla === 'Tab') {
            e.preventDefault();
            moverProxima(el);
            return;
        }

        // Espaço → próxima célula apenas no mobile
        if (tecla === ' ' && isMobile) {
            e.preventDefault();
            moverProxima(el);
            return;
        }

        // Permite todas as teclas de controle
        if (tecla.length > 1) return;

        const texto = el.innerText.replace(/:/g, '').trim();
        const ehLetras = /^[a-zA-Z]*$/.test(texto);
        if (ehLetras && texto.length >= 2 && /[a-zA-Z]/.test(tecla)) { e.preventDefault(); return; }
        if (!ehLetras && texto.replace(/\D/g,'').length >= 4 && /\d/.test(tecla)) { e.preventDefault(); return; }
    }

    /* ─── MÁSCARA HORÁRIO ─── */
    function mascaraHorario(el) {
        const texto = el.innerText;
        const raw   = texto.replace(/\D/g, "");

        // Remove classe de horário enquanto edita (o render vai reaplicar)
        el.classList.remove('is-horario');

        if (raw.length === 4 && !/[a-zA-Z]/.test(texto)) {
            const formatted = raw.substring(0, 2) + ":" + raw.substring(2, 4);
            el.innerText = formatted;
            try {
                const range = document.createRange();
                const sel   = window.getSelection();
                range.setStart(el.childNodes[0], formatted.length);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
            } catch(e) {}
        }
    }

    function updateDia(f, d, el) {
        const chave = `${meses[mesIdx]}_${ano}`;
        // Se tiver spans (display horário), extrai texto puro
        let val = el.innerText.replace(/\s+/g, '').trim().toUpperCase();
        // Reconstrói horário se vier separado (ex: "06" + "00" → "06:00")
        if (/^\d{4}$/.test(val)) val = val.substring(0,2) + ':' + val.substring(2,4);
        funcionarios[f].d[chave][d] = val || "F";
        render();
    }

    function updateNome(f, el) { funcionarios[f].n = el.innerText.trim().toUpperCase(); render(); }
    function updateTurno(f, el) { funcionarios[f].t = el.innerText.trim().toUpperCase(); render(); }

    /* ─── HELPER PDF: desenha célula com fundo + borda + texto ─── */
    function pdfCell(pdf, x, y, w, h, bgR, bgG, bgB, text, fSize, tR, tG, tB, bold, align) {
        pdf.setFillColor(bgR, bgG, bgB);
        pdf.rect(x, y, w, h, 'F');
        pdf.setDrawColor(25, 42, 62);
        pdf.setLineWidth(0.25);
        pdf.rect(x, y, w, h, 'S');
        if (text !== null && text !== undefined && String(text).length > 0) {
            pdf.setFont('helvetica', bold ? 'bold' : 'normal');
            pdf.setFontSize(fSize);
            pdf.setTextColor(tR, tG, tB);
            const tx = align === 'left' ? x + 2 : x + w / 2;
            pdf.text(String(text), tx, y + h / 2 + fSize * 0.18,
                { align: align === 'left' ? 'left' : 'center', baseline: 'middle' });
        }

    function exportPDF() {
        try {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
            const W = 297, H = 210;
            const dias  = getDaysInMonth(mesIdx, ano);
            const chave = meses[mesIdx] + '_' + ano;
            const mes   = meses[mesIdx] + ' ' + ano;
            const DL    = ['D','S','T','Q','Q','S','S'];

            // ── cores empresa ──
            const BLUE  = [21, 101, 192];
            const BDARK = [13, 71,  161];
            const LIME  = [161,178, 0  ];
            const WHITE = [255,255, 255];
            const LGRAY = [245,247, 250];
            const DGRAY = [60, 80,  100];

            // ── FUNDO ──
            pdf.setFillColor(255,255,255);
            pdf.rect(0,0,W,H,'F');

            // ── HEADER ──
            // faixa azul escuro topo — ocupa toda a largura
            pdf.setFillColor(BDARK[0],BDARK[1],BDARK[2]);
            pdf.rect(0,0,W,18,'F');
            // faixa lima fina
            pdf.setFillColor(LIME[0],LIME[1],LIME[2]);
            pdf.rect(0,18,W,1.2,'F');
            // faixa cinza clara abaixo
            pdf.setFillColor(245,247,250);
            pdf.rect(0,19.2,W,9,'F');
            pdf.setDrawColor(220,225,232);
            pdf.setLineWidth(0.3);
            pdf.line(0,28.2,W,28.2);

            // ── LOGO — área branca com padding na faixa azul ──
            // caixa branca arredondada para o logo
            var logoW = 48, logoH = 14;
            var logoBoxX = 5, logoBoxY = 2;
            var logoBoxW = logoW + 2, logoBoxH = logoH + 2;
            pdf.setFillColor(255,255,255);
            pdf.roundedRect(logoBoxX, logoBoxY, logoBoxW, logoBoxH, 1.5, 1.5, 'F');
            // desenha logo dentro da caixa branca
            try {
                pdf.addImage(LOGO_DATA_B64_WHITE, 'PNG', logoBoxX+1, logoBoxY+1, logoW, logoH);
            } catch(e) {}
            // linha separadora vertical fina
            pdf.setDrawColor(198, 212, 0);
            pdf.setLineWidth(0.5);
            pdf.line(logoBoxX + logoBoxW + 3, 2, logoBoxX + logoBoxW + 3, 16);



            // mes centralizado — deslocado para direita da logo
            var centerX = (logoBoxX + logoBoxW + 4 + W) / 2;
            pdf.setFont('helvetica','bold');
            pdf.setFontSize(14);
            pdf.setTextColor(255,255,255);
            pdf.text(mes, centerX, 11, {align:'center'});
            pdf.setFont('helvetica','normal');
            pdf.setFontSize(5.5);
            pdf.setTextColor(198,212,0);
            pdf.text('ESCALA OPERACIONAL', centerX, 16, {align:'center'});

            // info linha cinza (esquerda)
            pdf.setFont('helvetica','normal');
            pdf.setFontSize(6);
            pdf.setTextColor(100,120,145);
            pdf.text('Funcionarios: ' + funcionarios.length, 8, 25.5);
            pdf.text('Dias: ' + dias, 52, 25.5);
            pdf.text('Gerado: ' + new Date().toLocaleDateString('pt-BR'), 78, 25.5);

            // legenda (direita da linha cinza, sem colidir)
            var legs = [
                {t:'TRABALHO', r:21, g:101,b:192},
                {t:'FERIAS',   r:217,g:119,b:6  },
                {t:'FOLGA',    r:180,g:190,b:200 }
            ];
            var lx = W - 8;
            legs.forEach(function(lg) {
                pdf.setFillColor(lg.r,lg.g,lg.b);
                pdf.roundedRect(lx-17, 20.5, 17, 5.5, 1,1,'F');
                pdf.setFont('helvetica','bold');
                pdf.setFontSize(4.8);
                pdf.setTextColor(255,255,255);
                pdf.text(lg.t, lx-8.5, 23.8, {align:'center'});
                lx -= 20;
            });

            // ── TABELA via autoTable ──
            const startY = 30;
            const nW = 44;   // nome
            const tW2 = 7;   // turno
            const toW = 9;   // total
            const avW = W - 10 - nW - tW2 - toW;

            // largura por coluna de dia
            var colWide = [];
            for(var i=0;i<dias;i++) colWide.push(false);
            funcionarios.forEach(function(f){
                if(!f.d[chave]) return;
                for(var i=0;i<dias;i++){
                    if(/^\d{2}:\d{2}$/.test((f.d[chave][i]||'').trim())) colWide[i]=true;
                }
            });
            var bN=4.5, bW2=8.5;
            var rSum=0; colWide.forEach(function(w){rSum+=w?bW2:bN;});
            var sc = rSum>avW ? avW/rSum : 1;
            var cws = colWide.map(function(w){return (w?bW2:bN)*sc;});

            // monta head
            var headRow = ['FUNCIONARIO','T'];
            for(var i=1;i<=dias;i++){
                var dow=getDayOfWeek(ano,mesIdx,i);
                headRow.push(i+'\n'+DL[dow]);
            }
            headRow.push('DIAS');

            // monta body
            var body = [];
            funcionarios.forEach(function(f){
                if(!f.d[chave]) f.d[chave]=Array(31).fill('F');
                var row=[f.n, f.t];
                var total=0;
                for(var i=0;i<dias;i++){
                    var v=f.d[chave][i]||'F';
                    row.push(v);
                    if(v!=='F'&&v!=='FE') total++;
                }
                row.push(String(total));
                body.push(row);
            });

            // colStyles
            var colStyles = {};
            colStyles[0] = {cellWidth: nW,  halign:'left',   fontStyle:'bold',   fontSize:6,   cellPadding:1.2};
            colStyles[1] = {cellWidth: tW2, halign:'center', fontStyle:'bold',   fontSize:7,   cellPadding:0.8};
            for(var i=0;i<dias;i++){
                colStyles[i+2] = {
                    cellWidth:   cws[i],
                    halign:      'center',
                    fontSize:    colWide[i] ? 5.5 : 6,
                    cellPadding: colWide[i] ? 0.5 : 0.6
                };
            }
            colStyles[dias+2] = {cellWidth: toW, halign:'center', fontStyle:'bold', fontSize:7, cellPadding:0.8};

            pdf.autoTable({
                head: [headRow],
                body: body,
                startY: startY,
                margin: {left:5, right:5},
                tableWidth: W-10,
                styles: {
                    fontSize: 6,
                    cellPadding: 1,
                    lineColor: [210,218,228],
                    lineWidth: 0.25,
                    overflow: 'hidden',
                    minCellHeight: 0
                },
                headStyles: {
                    fillColor: BDARK,
                    textColor: WHITE,
                    fontStyle: 'bold',
                    fontSize: 5.5,
                    cellPadding: 1,
                    lineColor: [255,255,255],
                    lineWidth: 0.3,
                    valign: 'middle',
                    halign: 'center'
                },
                alternateRowStyles: {
                    fillColor: [245,248,252]
                },
                bodyStyles: {
                    fillColor: [255,255,255],
                    textColor: DGRAY,
                    valign: 'middle'
                },
                columnStyles: colStyles,
                didParseCell: function(data) {
                    if (data.section === 'head') {
                        var ci = data.column.index;
                        if (ci >= 2 && ci < dias+2) {
                            var dow = getDayOfWeek(ano, mesIdx, ci-1); // ci=2 → day 1
                            if (dow===0||dow===6) {
                                data.cell.styles.fillColor = [160,80,0];
                            }
                        }
                        if (ci === dias+2) {
                            data.cell.styles.fillColor = [9,50,120];
                            data.cell.styles.textColor = LIME;
                        }
                    }
                    if (data.section === 'body') {
                        var ci = data.column.index;
                        var val = String(data.cell.raw||'');
                        if (ci === 1) {
                            data.cell.styles.fillColor = [227,237,252];
                            data.cell.styles.textColor = BLUE;
                            data.cell.styles.fontStyle = 'bold';
                        }
                        if (ci >= 2 && ci < dias+2) {
                            var dayNum = ci - 1;
                            var dow2 = getDayOfWeek(ano, mesIdx, dayNum);
                            var wk2  = dow2===0||dow2===6;
                            var isHor = /^\d{2}:\d{2}$/.test(val);
                            if (val==='FE') {
                                data.cell.styles.fillColor   = [255,237,200];
                                data.cell.styles.textColor   = [180,83,9];
                                data.cell.styles.fontStyle   = 'bold';
                                data.cell.styles.fontSize    = 6;
                            } else if (val==='F') {
                                data.cell.styles.fillColor   = wk2 ? [255,248,235] : (data.row.index%2===0?[255,255,255]:[245,248,252]);
                                data.cell.styles.textColor   = [185,198,215];
                                data.cell.styles.fontStyle   = 'normal';
                                data.cell.styles.fontSize    = 6;
                            } else {
                                data.cell.styles.fillColor   = wk2 ? [213,232,255] : [227,239,255];
                                data.cell.styles.textColor   = isHor ? [13,71,161] : BLUE;
                                data.cell.styles.fontStyle   = 'bold';
                                data.cell.styles.fontSize    = isHor ? 5.5 : 6;
                            }
                        }
                        if (ci === dias+2) {
                            var tot = parseInt(val)||0;
                            data.cell.styles.fillColor = tot>0 ? BLUE : [230,235,242];
                            data.cell.styles.textColor = tot>0 ? WHITE : [150,165,185];
                            data.cell.styles.fontStyle = 'bold';
                        }
                    }
                },
                didDrawCell: function(data) {
                    // linha verde sob header
                    if (data.section==='head' && data.row.index===0) {
                        pdf.setDrawColor(LIME[0],LIME[1],LIME[2]);
                        pdf.setLineWidth(0.4);
                        pdf.line(data.cell.x, data.cell.y+data.cell.height,
                                 data.cell.x+data.cell.width, data.cell.y+data.cell.height);
                    }
                }
            });

            // ── RODAPE ──
            var finalY = pdf.lastAutoTable.finalY || H-10;
            pdf.setFillColor(BDARK[0],BDARK[1],BDARK[2]);
            pdf.rect(0,H-8,W,8,'F');
            pdf.setFillColor(LIME[0],LIME[1],LIME[2]);
            pdf.rect(0,H-8,W,0.8,'F');
            pdf.setFont('helvetica','bold');
            pdf.setFontSize(6);
            pdf.setTextColor(255,255,255);
            pdf.text('SATA SECURITY', 8, H-3.5);
            pdf.setFont('helvetica','normal');
            pdf.setTextColor(160,195,255);
            pdf.text('ESCALA OPERACIONAL  -  DOCUMENTO CONFIDENCIAL', 40, H-3.5);
            pdf.setTextColor(LIME[0],LIME[1],LIME[2]);
            pdf.text(String(ano), W-8, H-3.5, {align:'right'});

            pdf.save('ESCALA_SATA_' + mes.replace(' ','_') + '.pdf');
            showToast('PDF exportado com sucesso!');

        } catch(e) {
            console.error('Erro PDF:', e);
            alert('Erro: ' + e.message);
        }
    }



    render();
</script>
</body>
</html>
