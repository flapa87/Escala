<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SATA Security - Escala Profissional</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0f1a;
            --bg-card: #1a2332;
            --text-primary: #f8fafc;
            --sata-blue: #0066cc;
            --sata-green: #c8db00;
            --border-default: rgba(148, 163, 184, 0.2);
            --work-bg: rgba(59, 130, 246, 0.2);
            --off-bg: rgba(255, 255, 255, 0.05);
            --vacation-bg: rgba(245, 158, 11, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
        }

        /* Interface do Usuário */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 20px; background: var(--bg-card);
            border-radius: 12px; border-bottom: 3px solid var(--sata-blue);
        }

        .btn { 
            padding: 12px 24px; border-radius: 8px; cursor: pointer; 
            font-weight: 800; border: none; background: var(--sata-blue); color: white;
            transition: 0.3s; text-transform: uppercase;
        }
        .btn:hover { background: #004d99; transform: scale(1.02); }

        .table-wrapper { background: var(--bg-card); border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        th, td { padding: 10px 5px; border: 1px solid var(--border-default); text-align: center; font-size: 12px; }
        th { background: #111827; color: #94a3b8; font-size: 10px; }
        
        .name-cell { text-align: left; padding-left: 15px; width: 220px; font-weight: 600; }
        .editable { cursor: pointer; font-weight: 700; }
        .d-work { color: #60a5fa; background: var(--work-bg); }
        .d-vacation { color: #fbbf24; background: var(--vacation-bg); }
        .total-cell { font-weight: 800; color: var(--sata-green); }

        /* --- MOTOR DE PDF (ESTRUTURA DE IMPRESSÃO) --- */
        #pdf-template {
            position: absolute; left: -5000px; top: 0;
            width: 297mm; /* Largura A4 Paisagem */
            background: #ffffff; color: #000000;
            padding: 10mm; box-sizing: border-box;
        }

        #pdf-template table { 
            width: 100%; border-collapse: collapse; 
            border: 0.5pt solid #000; margin-top: 10px;
        }

        #pdf-template th, #pdf-template td { 
            border: 0.5pt solid #000; padding: 3px 1px; 
            font-size: 8pt; font-family: Arial, sans-serif; 
        }

        #pdf-template th { background: #f0f0f0; font-weight: bold; }
        #pdf-template .pdf-name { text-align: left; padding-left: 5px; font-weight: bold; width: 180px; }
        #pdf-template .pdf-work { background: #e0eaff !important; }
        #pdf-template .pdf-vacation { background: #fff4d1 !important; }
        #pdf-template .pdf-header-title { 
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 2pt solid #0066cc; padding-bottom: 5px; margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div>
            <h1 style="color: var(--sata-blue)">SATA <span style="color: var(--sata-green)">SECURITY</span></h1>
            <p style="font-size: 10px; letter-spacing: 2px; opacity: 0.7;">CONTROLE DE ESCALA MENSAL</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <select id="monthSelect" onchange="updateMonth()" style="padding: 10px; border-radius: 5px;"></select>
            <button class="btn" onclick="gerarPDF()">Gerar PDF Alta Definição</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead id="head"></thead>
            <tbody id="body"></tbody>
        </table>
    </div>

    <div id="pdf-template"></div>

    <script>
        const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        let currentMonth = 2; // Março
        let currentYear = 2026;

        let funcionarios = [
            { nome: "Ana Daria F. Sarmento", turno: "D", dias: ["F","F","8","8","8","5","F","F","F","8","8","F","8","F","6","F","8","8","F","8","8","6","F","8","8","F","8","F","F","F","17"] },
            { nome: "Brenda M. Oliveira", turno: "C", dias: ["F","14","14","14","14","14","F","F","14","14","14","14","14","F","F","0","14","14","14","14","F","F","14","14","14","14","14","F","F","14","14"] },
            { nome: "Celoir A. Moraes", turno: "E", dias: ["8","12","20","F","20","F","F","F","12","F","12","8","F","12","8","12","F","12","F","8","12","8","12","F","12","F","8","12","8","F","8"] },
            { nome: "Clenilton F. Carvalho", turno: "A", dias: ["F","5","6","5","F","F","12","8","5","F","5","F","F","5","F","5","6","5","F","F","5","F","5","6","5","F","F","5","8","F","8"] },
            { nome: "Caio V. Sena", turno: "F", dias: ["F","21","20","21","20","20","F","20","21","20","21","20","F","20","20","21","20","21","20","F","20","20","21","20","21","20","F","20","F","F","F"] },
            { nome: "Elizara Flores", turno: "E", dias: ["F","12","F","12","F","8","12","8","12","F","12","F","8","12","8","12","F","12","8","8","12","F","12","F","12","8","8","12","F","8","F"] },
            { nome: "Jailson M. Moraes", turno: "A", dias: ["F","5","6","5","F","F","5","F","5","6","5","F","8","5","F","5","6","5","F","F","5","F","5","6","5","F","F","5","F","8","F"] },
            { nome: "Mayara C. Jesus", turno: "F", dias: ["20","F","F","12","8","20","20","F","21","20","21","20","20","F","20","21","20","21","20","20","F","F","21","20","21","20","20","F","21","F","F"] },
            { nome: "Rogerio P. Pinheiro", turno: "D", dias: ["20","21","F","21","F","F","20","20","F","6","8","F","F","20","F","6","F","8","F","F","20","20","6","F","8","F","F","20","21","F","F"] },
            { nome: "Fernando S. Lapa", turno: "B", dias: ["F","15","15","15","15","15","F","F","FE","FE","15","15","15","15","F","F","15","FE","15","15","15","F","F","15","15","15","15","15","F","F","15"] },
            { nome: "Fabricio J. Aguiar", turno: "G", dias: ["F","9","9","9","9","9","F","F","9","9","9","9","9","F","F","9","9","9","9","9","F","F","9","9","9","9","9","F","F","9","9"] }
        ];

        function init() {
            const select = document.getElementById('monthSelect');
            monthNames.forEach((m, i) => select.add(new Option(m, i)));
            select.value = currentMonth;
            render();
        }

        function render() {
            const days = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            let h = `<tr><th class="name-cell">FUNCIONÁRIO</th><th>T</th>`;
            for(let i=1; i<=days; i++) h += `<th>${i}</th>`;
            h += `<th>TOT</th></tr>`;
            document.getElementById('head').innerHTML = h;

            let b = "";
            funcionarios.forEach((f, idx) => {
                let tot = 0;
                let cells = f.dias.map((d, dIdx) => {
                    const n = parseInt(d);
                    if(!isNaN(n) && n > 0) tot++;
                    const cls = d === "FE" ? "d-vacation" : (n > 0 ? "d-work" : "");
                    return `<td class="editable ${cls}" contenteditable="true" onblur="updateVal(${idx}, ${dIdx}, this)">${d}</td>`;
                }).join('');
                
                b += `<tr><td class="name-cell">${f.nome}</td><td style="color:#3b82f6; font-weight:800">${f.turno}</td>${cells}<td class="total-cell" id="t-${idx}">${tot}d</td></tr>`;
            });
            document.getElementById('body').innerHTML = b;
        }

        function updateVal(fIdx, dIdx, el) {
            funcionarios[fIdx].dias[dIdx] = el.innerText.trim().toUpperCase();
            render(); // Simplificado para garantir consistência
        }

        async function gerarPDF() {
            const template = document.getElementById('pdf-template');
            const days = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Monta o HTML do PDF
            let html = `
                <div class="pdf-header-title">
                    <div>
                        <h1 style="font-size: 22pt; color: #0066cc; margin:0">SATA SECURITY</h1>
                        <p style="font-size: 9pt; color: #666; margin:0">Relatório de Escala Operacional</p>
                    </div>
                    <div style="text-align:right">
                        <h2 style="font-size: 14pt; margin:0">${monthNames[currentMonth]} / ${currentYear}</h2>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th class="pdf-name">NOME DO COLABORADOR</th>
                            <th style="width:20px">T</th>`;
            for(let i=1; i<=days; i++) html += `<th>${i}</th>`;
            html += `<th>TOT</th></tr></thead><tbody>`;

            funcionarios.forEach(f => {
                let tot = 0;
                html += `<tr><td class="pdf-name">${f.nome}</td><td style="font-weight:bold">${f.turno}</td>`;
                f.dias.forEach(d => {
                    const n = parseInt(d);
                    if(!isNaN(n) && n > 0) tot++;
                    const cls = d === "FE" ? "pdf-vacation" : (n > 0 ? "pdf-work" : "");
                    html += `<td class="${cls}">${d}</td>`;
                });
                html += `<td style="font-weight:bold; background:#f0f0f0">${tot}d</td></tr>`;
            });

            html += `</tbody></table>
                    <div style="margin-top: 20px; font-size: 8pt; color: #888; text-align: center;">
                        Gerado em ${new Date().toLocaleString()} - Sistema de Gestão SATA Security
                    </div>`;

            template.innerHTML = html;

            // Captura com alta escala para não pixelar
            const canvas = await html2canvas(template, { 
                scale: 3, 
                useCORS: true,
                logging: false 
            });
            
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            
            // Criar PDF Paisagem (Landscape)
            const pdf = new jsPDF('l', 'mm', 'a4');
            const imgProps = pdf.getImageProperties(imgData);
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
            
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(`ESCALA_SATA_${monthNames[currentMonth].toUpperCase()}_${currentYear}.pdf`);
            
            template.innerHTML = ""; // Limpa o lixo
        }

        init();
    </script>
</body>
</html>
