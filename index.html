<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATA Security - PDF ULTRA FIX</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; background: #0a0f1a; color: white; padding: 20px; }
        
        /* Interface */
        .header { display: flex; justify-content: space-between; align-items: center; background: #1a2332; padding: 20px; border-radius: 10px; border-bottom: 4px solid #0066cc; margin-bottom: 20px; }
        .btn { background: #0066cc; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        
        .table-container { overflow-x: auto; background: #1a2332; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; font-size: 12px; }
        th, td { border: 1px solid #374151; padding: 8px 4px; text-align: center; }
        th { background: #111827; color: #9ca3af; }
        .name-cell { text-align: left; padding-left: 10px; width: 200px; font-weight: bold; position: sticky; left: 0; background: #1a2332; }
        .d-work { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .total-cell { font-weight: bold; color: #c8db00; }

        /* --- O SEGREDO PARA NÃO CORTAR --- */
        #pdf-render-zone {
            position: absolute;
            left: -10000px; /* Escondido */
            top: 0;
            width: 1600px; /* Largura forçada para caber 31 dias + Nome sem esmagar */
            background: white;
            color: black;
        }
        #pdf-render-zone table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; /* Força as colunas a respeitarem o tamanho */
        }
        #pdf-render-zone th, #pdf-render-zone td { 
            border: 1pt solid black; 
            font-size: 10pt; 
            padding: 5px 2px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1 style="color: #0066cc; margin:0">SATA <span style="color: #c8db00">SECURITY</span></h1>
            <p style="font-size: 10px; opacity: 0.6;">SISTEMA DE ESCALAS V4.0</p>
        </div>
        <button class="btn" onclick="gerarPDF()">Baixar PDF Sem Cortes</button>
    </div>

    <div class="table-container">
        <table>
            <thead id="h"></thead>
            <tbody id="b"></tbody>
        </table>
    </div>

    <div id="pdf-render-zone"></div>

    <script>
        const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        let fucionarios = [
            { nome: "Ana Daria F. Sarmento", turno: "D", dias: ["F","F","8","8","8","5","F","F","F","8","8","F","8","F","6","F","8","8","F","8","8","6","F","8","8","F","8","F","F","F","17"] },
            { nome: "Brenda M. Oliveira", turno: "C", dias: ["F","14","14","14","14","14","F","F","14","14","14","14","14","F","F","0","14","14","14","14","F","F","14","14","14","14","14","F","F","14","14"] },
            { nome: "Celoir A. Moraes", turno: "E", dias: ["8","12","20","F","20","F","F","F","12","F","12","8","F","12","8","12","F","12","F","8","12","8","12","F","12","F","8","12","8","F","8"] },
            { nome: "Clenilton F. Carvalho", turno: "A", dias: ["F","5","6","5","F","F","12","8","5","F","5","F","F","5","F","5","6","5","F","F","5","F","5","6","5","F","F","5","8","F","8"] },
            { nome: "Caio V. Sena", turno: "F", dias: ["F","21","20","21","20","20","F","20","21","20","21","20","F","20","20","21","20","21","20","F","20","20","21","20","21","20","F","20","F","F","F"] },
            { nome: "Elizara Flores", turno: "E", dias: ["F","12","F","12","F","8","12","8","12","F","12","F","8","12","8","12","F","12","8","8","12","F","12","F","12","8","8","12","F","8","F"] },
            { nome: "Jailson M. Moraes", turno: "A", dias: ["F","5","6","5","F","F","5","F","5","6","5","F","8","5","F","5","6","5","F","F","5","F","5","6","5","F","F","5","F","8","F"] },
            { nome: "Mayara C. Jesus", turno: "F", dias: ["20","F","F","12","8","20","20","F","21","20","21","20","20","F","20","21","20","21","20","20","F","F","21","20","21","20","20","F","21","F","F"] },
            { nome: "Rogerio P. Pinheiro", turno: "D", dias: ["20","21","F","21","F","F","20","20","F","6","8","F","F","20","F","6","F","8","F","F","20","20","6","F","8","F","F","20","21","F","F"] },
            { nome: "Fernando S. Lapa", turno: "B", dias: ["F","15","15","15","15","15","F","F","FE","FE","15","15","15","15","F","F","15","FE","15","15","15","F","F","15","15","15","15","15","F","F","15"] },
            { nome: "Fabricio J. Aguiar", turno: "G", dias: ["F","9","9","9","9","9","F","F","9","9","9","9","9","F","F","9","9","9","9","9","F","F","9","9","9","9","9","F","F","9","9"] }
        ];

        function render() {
            let h = `<tr><th class="name-cell">NOME</th><th>T</th>`;
            for(let i=1; i<=31; i++) h += `<th>${i}</th>`;
            h += `<th>TOT</th></tr>`;
            document.getElementById('h').innerHTML = h;

            let b = "";
            fucionarios.forEach((f, idx) => {
                let tot = 0;
                let cells = f.dias.map(d => {
                    if(!isNaN(parseInt(d)) && parseInt(d) > 0) tot++;
                    return `<td class="${!isNaN(parseInt(d)) ? 'd-work' : ''}">${d}</td>`;
                }).join('');
                b += `<tr><td class="name-cell">${f.nome}</td><td>${f.turno}</td>${cells}<td class="total-cell">${tot}d</td></tr>`;
            });
            document.getElementById('b').innerHTML = b;
        }

        async function gerarPDF() {
            const zone = document.getElementById('pdf-render-zone');
            // Criar a tabela idêntica na zona branca
            let html = `<div style="padding:20px"><h1 style="color:#0066cc">SATA SECURITY - ESCALA MARÇO 2026</h1><table>`;
            html += document.getElementById('h').outerHTML;
            html += document.getElementById('b').outerHTML;
            html += `</table></div>`;
            zone.innerHTML = html;

            // CONFIGURAÇÃO CRÍTICA DO CANVAS
            const canvas = await html2canvas(zone, {
                scale: 2,         // Alta qualidade
                width: 1600,      // Força a largura total da tabela
                windowWidth: 1600,// Simula um ecrã gigante para não cortar
                logging: false,
                backgroundColor: "#ffffff"
            });

            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            
            // PDF em Paisagem (Landscape)
            const pdf = new jsPDF('l', 'mm', 'a4');
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();

            // Ajusta a imagem proporcionalmente à folha A4
            pdf.addImage(imgData, 'PNG', 0, 0, pageWidth, pageHeight);
            pdf.save("ESCALA_SATA_PERFEITA.pdf");
            
            zone.innerHTML = ""; // Limpa memória
        }

        render();
    </script>
</body>
</html>
